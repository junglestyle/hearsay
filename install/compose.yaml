name: hearsay

services:
  receiver:
    build: ..
    image: hearsay
    container_name: hearsay
    user: "568:568"
    env_file: /mnt/storage/hearsay/config/receiver.env
    environment:
      HEARSAY_RAW_DIR: /data/raw
    volumes:
      - /mnt/storage/hearsay/raw:/data/raw
    # Loopback only: the public path is Cloudflare Tunnel (install/tunnel.sh).
    ports:
      - "127.0.0.1:8787:8000"
    restart: unless-stopped

  # Web portal for naming speakers. Reachable on the LAN and tailnet only:
  # never 0.0.0.0 (the NAS has a public IPv6 address), and never add it to
  # the Cloudflare tunnel. install/nas.sh exports the two addresses; the
  # loopback defaults only apply when compose runs without them.
  portal:
    image: hearsay
    pull_policy: never
    container_name: hearsay-portal
    user: "568:568"
    # capture.env too: the iPhone app logs in with the capture token.
    env_file:
      - /mnt/storage/hearsay/config/portal.env
      - /mnt/storage/hearsay/config/capture.env
    environment:
      HEARSAY_DB: /data/db/hearsay.sqlite
      HEARSAY_AUDIO_DIR: /data/audio
      HEARSAY_LABELS_DIR: /data/labels
    volumes:
      - /mnt/storage/hearsay/db:/data/db:ro
      - /mnt/storage/hearsay/audio:/data/audio:ro
      - /mnt/storage/hearsay/labels:/data/labels
    ports:
      - "${HEARSAY_LAN_IP:-127.0.0.1}:8788:8000"
      - "${HEARSAY_TAILNET_IP:-127.0.0.2}:8788:8000"
    command: ["uvicorn", "--factory", "hearsay.portal:app_from_env", "--host", "0.0.0.0", "--port", "8000"]
    restart: unless-stopped

  # Uploads from our own recorder (capture/): pendant audio, so tailnet only.
  # Never the LAN (the recorder reaches the NAS over the tailnet from
  # anywhere), never 0.0.0.0, never the Cloudflare tunnel.
  capture:
    image: hearsay
    pull_policy: never
    container_name: hearsay-capture
    user: "568:568"
    env_file: /mnt/storage/hearsay/config/capture.env
    environment:
      HEARSAY_RAW_DIR: /data/raw
    volumes:
      - /mnt/storage/hearsay/raw:/data/raw
    ports:
      - "${HEARSAY_TAILNET_IP:-127.0.0.2}:8789:8000"
    command: ["uvicorn", "--factory", "hearsay.receiver:capture_app_from_env", "--host", "0.0.0.0", "--port", "8000",
              "--no-access-log"]
    restart: unless-stopped

  # One-shot, not started by `up`: rebuilds the database, conversation audio
  # and speaker labels from raw. The labels dir holds the operator's own input
  # (enrollment windows, labels), which reprocessing reads but never writes.
  reprocess:
    build:
      context: ..
      target: worker
      args:
        HEARSAY_COMMIT: ${HEARSAY_COMMIT:-unknown}
    image: hearsay-worker
    profiles: [tools]
    user: "568:568"
    network_mode: none
    environment:
      HEARSAY_RAW_DIR: /data/raw
      HEARSAY_DB: /data/db/hearsay.sqlite
      HEARSAY_AUDIO_DIR: /data/audio
      HEARSAY_LABELS_DIR: /data/labels
      HEARSAY_TRANSCRIPTS_DIR: /data/transcripts
      HEARSAY_IMPORTS_DIR: /data/imports
      HEARSAY_STREAM_DIR: /data/stream
    volumes:
      - /mnt/storage/hearsay/raw:/data/raw:ro
      - /mnt/storage/hearsay/db:/data/db
      - /mnt/storage/hearsay/audio:/data/audio
      - /mnt/storage/hearsay/labels:/data/labels:ro
      - /mnt/storage/hearsay/transcripts:/data/transcripts:ro
      - /mnt/storage/hearsay/imports:/data/imports:ro
      - /mnt/storage/hearsay/stream:/data/stream
    command: ["python", "-m", "hearsay.reprocess"]

  # One-shot: the test suite, including the check that every real capture reprocesses.
  check:
    build:
      context: ..
      target: test
      args:
        HEARSAY_COMMIT: ${HEARSAY_COMMIT:-unknown}
    image: hearsay-test
    profiles: [tools]
    user: "568:568"
    network_mode: none
    environment:
      HEARSAY_CHECK_RAW_DIR: /data/raw
      HEARSAY_CHECK_TRANSCRIPTS_DIR: /data/transcripts
      HEARSAY_CHECK_IMPORTS_DIR: /data/imports
    volumes:
      - /mnt/storage/hearsay/raw:/data/raw:ro
      - /mnt/storage/hearsay/transcripts:/data/transcripts:ro
      - /mnt/storage/hearsay/imports:/data/imports:ro
    command: ["pytest", "-q", "-p", "no:cacheprovider", "/tests"]
