[project]
name = "hearsay"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
# Installed in the worker image only; torch comes from the CPU wheel index there.
speakers = [
    "speechbrain==1.1.1",
    "torch==2.14.0",
    "torchaudio==2.11.0",
]
dev = [
    "pytest",
    "httpx2",
]

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hearsay"]
