[project]
name = "hearsay"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
# Installed in the worker image only; torch comes from the CPU wheel index there.
speakers = [
    "numpy==2.5.3",
    "silero-vad==6.2.3",
    "speechbrain==1.1.1",
    "torch==2.14.0",
    "torchaudio==2.11.0",
]
# The dev box GPU worker only (install/gpu.sh): Parakeet (NeMo) and pyannote.
# transformers is pinned because without it the resolver backtracks to a
# 2021 release that doesn't build.
transcribe = [
    "nemo_toolkit[asr]==3.0.0",
    "pyannote.audio==4.0.7",
    "transformers==4.57.6",
    "torch==2.8.0",
    "torchaudio==2.8.0",
]
dev = [
    "pytest",
    "httpx2",
    "numpy==2.5.3",
]

[project.scripts]
# The operator's labeling tool, installable anywhere with `uv tool install`.
hearsay-label = "hearsay.label:main"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["hearsay"]
